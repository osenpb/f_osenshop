<section class="max-w-4xl mx-auto px-6 py-16 text-white bg-black rounded-3xl">
  <div class="mb-12 text-center">
    <h1 class="text-3xl font-bold tracking-tighter uppercase italic">
      Finalizar <span class="text-zinc-500 font-light">Compra</span>
    </h1>
    <div class="h-1 w-12 bg-zinc-800 mx-auto mt-4 rounded-full"></div>
  </div>

  <div class="space-y-8">
    <app-checkout-form />
  </div>

  <div class="flex flex-col md:flex-row items-center justify-between gap-6 pt-10">
    <div class="text-zinc-500 text-[11px] uppercase tracking-widest text-center md:text-left">
      Al continuar, aceptas nuestras <br>
      <span class="text-zinc-300 decoration-zinc-700 underline underline-offset-4 cursor-pointer">políticas de privacidad</span>
    </div>
    <button
      (click)="onContinueToPayment()"
      [disabled]="!checkoutState.checkoutFormValid()"
      class="w-full md:w-auto bg-white text-black px-12 py-4 rounded-full text-xs font-bold uppercase tracking-[0.2em] hover:bg-zinc-200 transition-all transform active:scale-95 disabled:opacity-20 disabled:cursor-not-allowed shadow-[0_10px_20px_rgba(255,255,255,0.1)]"
    >
      Continuar al Pago
    </button>
  </div>
</section>
